name: CI/CD Pipeline - Zero-Downtime Blue-Green Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: production_deploy
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # 1. BUILD FRONTENDS & VALIDATE BACKEND
  # ===========================================================================
  build-and-test:
    name: Build Frontends & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            admin/package-lock.json
            server/package-lock.json

      # Verify Backend syntax
      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Server Syntax
        run: |
          cd server
          node -c server.js
          node -c app.js
          node -c ecosystem.config.cjs
          node -c src/config/db.js
          node -c src/controllers/admin.controller.js
          node -c src/controllers/chat.controller.js
          node -c src/controllers/newsletter.controller.js
          node -c src/services/newsletter.service.js

      # Build Client (Student Portal)
      - name: Build Client (Vite)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api/v1' }}
        run: |
          cd client
          npm ci
          npm run build

      # Build Admin Dashboard
      - name: Build Admin (Vite)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api/v1' }}
        run: |
          cd admin
          npm ci
          npm run build

      # Archive artifacts for deployment
      - name: Archive Client Dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

      - name: Archive Admin Dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist/
          retention-days: 1

  # ===========================================================================
  # 2. ZERO-DOWNTIME DEPLOYMENT (ATOMIC SYMLINK + BLUE-GREEN CONTAINER SWAP)
  # ===========================================================================
  deploy:
    name: Deploy to Contabo VPS (Zero-Downtime)
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Client Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Download Admin Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin/dist

      # Configure SSH Authentication
      - name: Setup SSH Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p $PORT -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Ensure rsync is installed on target VPS
      - name: Ensure target VPS has rsync
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -p $PORT ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            "command -v rsync >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq rsync)"

      # Create Timestamped Release Directory on VPS
      - name: Prepare Release Structure on VPS
        run: |
          RELEASE_ID=$(date +%Y%m%d_%H%M%S)
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"

          ssh -p $PORT ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /var/www/mmust-dcbt/releases/$RELEASE_ID/client/dist \
                      /var/www/mmust-dcbt/releases/$RELEASE_ID/admin/dist \
                      /var/www/mmust-dcbt/server \
                      /var/www/mmust-dcbt/nginx \
                      /var/www/mmust-dcbt/scripts"

      # Sync Frontends into New Release Folder
      - name: Rsync Frontends to Release Folder
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          rsync -avz -e "ssh -p $PORT" \
            client/dist/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/mmust-dcbt/releases/${{ env.RELEASE_ID }}/client/dist/

          rsync -avz -e "ssh -p $PORT" \
            admin/dist/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/mmust-dcbt/releases/${{ env.RELEASE_ID }}/admin/dist/

      # Sync Server Source Code, Nginx Configs & Scripts
      - name: Rsync Backend Source, Nginx & Tools
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'coverage' \
            -e "ssh -p $PORT" \
            server/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/mmust-dcbt/server/

          rsync -avz -e "ssh -p $PORT" \
            docker-compose.yml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/mmust-dcbt/docker-compose.yml

          rsync -avz -e "ssh -p $PORT" \
            nginx/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/mmust-dcbt/nginx/

          rsync -avz -e "ssh -p $PORT" \
            scripts/ ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/mmust-dcbt/scripts/

          rsync -avz -e "ssh -p $PORT" \
            scripts/rollback.sh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/mmust-dcbt/rollback.sh

      # Execute Blue-Green Zero-Downtime Rollout on VPS
      - name: Execute Blue-Green Container Swap & Atomic Symlink
        run: |
          PORT="${{ secrets.VPS_PORT }}"; PORT="${PORT:-22}"
          ssh -p $PORT ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s << 'EOF'
            set -e
            APP_DIR="/var/www/mmust-dcbt"
            RELEASE_DIR="$APP_DIR/releases/${{ env.RELEASE_ID }}"
            UPSTREAM_FILE="$APP_DIR/upstream.conf"

            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi

            cd "$APP_DIR"
            chmod +x rollback.sh scripts/*.sh

            # 1. Update/write secure production .env (preserves existing server values if secrets not passed)
            touch .env
            chmod 600 .env

            set_env_val() {
              local key="$1"
              local val="$2"
              local default_val="$3"
              if [ -n "$val" ]; then
                local escaped_val=$(printf '%s\n' "$val" | sed -e 's/[\/&]/\\&/g')
                if grep -q "^${key}=" .env; then
                  sed -i "s|^${key}=.*|${key}=${escaped_val}|" .env
                else
                  echo "${key}=${val}" >> .env
                fi
              elif ! grep -q "^${key}=" .env && [ -n "$default_val" ]; then
                echo "${key}=${default_val}" >> .env
              fi
            }

            set_env_val "NODE_ENV" "production"
            set_env_val "PORT" "5000"
            set_env_val "POSTGRES_DB" "${{ secrets.POSTGRES_DB }}" "mmust_dcbt"
            set_env_val "POSTGRES_USER" "${{ secrets.POSTGRES_USER }}" "postgres"
            set_env_val "DATABASE_URL" "${{ secrets.DATABASE_URL }}"
            set_env_val "DB_SSL" "${{ secrets.DB_SSL }}" "false"
            set_env_val "NEON_DATABASE_URL" "${{ secrets.NEON_DATABASE_URL }}"
            set_env_val "GEMINI_API_KEY" "${{ secrets.GEMINI_API_KEY }}"
            set_env_val "EMAIL_USER" "${{ secrets.EMAIL_USER }}"
            set_env_val "EMAIL_PASS" "${{ secrets.EMAIL_PASS }}"
            set_env_val "ALLOWED_ORIGINS" "${{ secrets.ALLOWED_ORIGINS }}" "*"

            # Auto-generate secure secrets if not provided in GitHub Secrets or .env
            if ! grep -q "^POSTGRES_PASSWORD=" .env || [ -z "$(grep '^POSTGRES_PASSWORD=' .env | cut -d= -f2-)" ]; then
              if [ -n "${{ secrets.POSTGRES_PASSWORD }}" ]; then
                set_env_val "POSTGRES_PASSWORD" "${{ secrets.POSTGRES_PASSWORD }}"
              else
                set_env_val "POSTGRES_PASSWORD" "$(openssl rand -hex 24)"
              fi
            fi

            if ! grep -q "^JWT_SECRET=" .env || [ -z "$(grep '^JWT_SECRET=' .env | cut -d= -f2-)" ]; then
              if [ -n "${{ secrets.JWT_SECRET }}" ]; then
                set_env_val "JWT_SECRET" "${{ secrets.JWT_SECRET }}"
              else
                set_env_val "JWT_SECRET" "$(openssl rand -hex 32)"
              fi
            fi

            chmod 600 .env

            # 2. Run Preflight Security & Secrets Validation
            echo ">>> Running preflight security & secret validation..."
            bash scripts/preflight-check.sh .env

            # 3. Initialize upstream file if not present (default to 5001 blue)
            if [ ! -f "$UPSTREAM_FILE" ]; then
              echo "server 127.0.0.1:5001;" > "$UPSTREAM_FILE"
            fi

            # 4. Auto-configure Nginx site
            if [ -f "$APP_DIR/nginx/mmust-dcbt-unified.conf" ]; then
              echo ">>> Initializing / Updating Nginx virtual host..."
              $SUDO cp "$APP_DIR/nginx/mmust-dcbt-unified.conf" /etc/nginx/sites-available/mmust-dcbt.conf
              $SUDO ln -sf /etc/nginx/sites-available/mmust-dcbt.conf /etc/nginx/sites-enabled/mmust-dcbt.conf
              $SUDO rm -f /etc/nginx/sites-enabled/default
            fi

            # 5. Determine Active Slot vs Target Standby Slot
            if grep -q "5001" "$UPSTREAM_FILE"; then
              TARGET_SLOT="green"
              TARGET_SERVICE="server_green"
              TARGET_CONTAINER="mmust_dcbt_server_green"
              TARGET_PORT=5002
              OLD_CONTAINER="mmust_dcbt_server_blue"
            else
              TARGET_SLOT="blue"
              TARGET_SERVICE="server_blue"
              TARGET_CONTAINER="mmust_dcbt_server_blue"
              TARGET_PORT=5001
              OLD_CONTAINER="mmust_dcbt_server_green"
            fi

            echo ">>> Active Slot: $OLD_CONTAINER | Deploying Target: $TARGET_SERVICE (Port $TARGET_PORT)..."

            # 6. Ensure DB container is up
            docker compose up -d db

            # Optional: If local DB has no tables and NEON_DATABASE_URL is set, seed it
            if [ -f "scripts/seed_from_neon.sh" ]; then
              bash scripts/seed_from_neon.sh || true
            fi

            # 7. Build and start Target container while Old container stays live
            docker compose build "$TARGET_SERVICE"
            docker compose up -d "$TARGET_SERVICE"

            # 8. Verify health of Target container before routing any traffic
            echo ">>> Waiting for $TARGET_CONTAINER to become healthy on port $TARGET_PORT..."
            MAX_ATTEMPTS=30
            ATTEMPT=0
            HEALTHY=false

            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if curl -s -f "http://127.0.0.1:${TARGET_PORT}/health/ready" > /dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              sleep 1
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ "$HEALTHY" = false ]; then
              echo "[CRITICAL ERROR] Target container $TARGET_CONTAINER failed health check."
              echo "Aborting deployment! Old container $OLD_CONTAINER remains active and untouched."
              docker stop "$TARGET_CONTAINER" || true
              exit 1
            fi

            echo ">>> Healthcheck passed on port $TARGET_PORT!"

            # 9. Switch Upstream to New Port
            echo "server 127.0.0.1:${TARGET_PORT};" > "$UPSTREAM_FILE"

            # 10. Switch Frontend Atomic Symlink
            ln -sfn "$RELEASE_DIR" "$APP_DIR/current"
            chmod -R 755 "$APP_DIR"
            chmod 600 "$APP_DIR/.env"

            # 11. Ensure Firewall allows HTTP (80) & HTTPS (443)
            if command -v ufw >/dev/null 2>&1 && $SUDO ufw status | grep -q "Status: active"; then
              echo ">>> Ensuring ports 80 & 443 are open in UFW firewall..."
              $SUDO ufw allow 80/tcp || true
              $SUDO ufw allow 443/tcp || true
              $SUDO ufw reload || true
            fi

            # 12. Graceful Nginx reload
            if command -v systemctl >/dev/null 2>&1; then
              $SUDO systemctl enable --now nginx
              $SUDO nginx -t && ($SUDO systemctl reload nginx || $SUDO systemctl restart nginx)
              echo ">>> Nginx reloaded with new upstream and frontend assets."
            fi

            # 12. Stop Old Container (DO NOT DELETE - KEPT FOR INSTANT ROLLBACK)
            if docker ps --format '{{.Names}}' | grep -q "^${OLD_CONTAINER}$"; then
              echo ">>> Stopping old container $OLD_CONTAINER (preserved for rollback)..."
              docker stop "$OLD_CONTAINER" || true
            fi

            # 13. Cleanup old releases (keep last 5)
            cd "$APP_DIR/releases"
            ls -1dt * | tail -n +6 | xargs -r rm -rf

            # 14. Prune dangling build images
            docker image prune -f

            # 15. Ensure daily 2:00 AM Neon Sync cron job is registered
            if [ -f "$APP_DIR/scripts/sync_to_neon.sh" ] && ! crontab -l 2>/dev/null | grep -q "sync_to_neon.sh"; then
              (crontab -l 2>/dev/null; echo "0 2 * * * bash $APP_DIR/scripts/sync_to_neon.sh >> /var/log/mmust_neon_sync.log 2>&1") | crontab -
              echo ">>> Registered daily 2:00 AM Neon database sync cron job."
            fi

            echo "=========================================================="
            echo " MMUST DCBT Zero-Downtime Deployment Finished Successfully!"
            echo " Active Slot: $TARGET_SLOT on port $TARGET_PORT"
            echo " Rollback available at any time via: bash $APP_DIR/rollback.sh"
            echo "=========================================================="
          EOF
