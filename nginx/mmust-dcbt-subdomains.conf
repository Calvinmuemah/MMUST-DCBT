# =============================================================================
# MMUST DCBT - Nginx Virtual Host Configuration (Subdomains Architecture)
# Zero-Downtime Edition (Blue-Green Upstream + Atomic Symlinks)
#
# Copy to: /etc/nginx/sites-available/mmust-dcbt.conf
# Enable:  ln -sf /etc/nginx/sites-available/mmust-dcbt.conf /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx
# SSL:     certbot --nginx -d yourdomain.com -d www.yourdomain.com -d admin.yourdomain.com -d api.yourdomain.com
# =============================================================================

# Shared Gzip Settings
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    image/svg+xml;

# -----------------------------------------------------------------------------
# DYNAMIC BACKEND UPSTREAM (Blue-Green Switching via /var/www/mmust-dcbt/upstream.conf)
# -----------------------------------------------------------------------------
upstream backend_api {
    # Dynamically managed by CI/CD: contains either "server 127.0.0.1:5001;" or "server 127.0.0.1:5002;"
    include /var/www/mmust-dcbt/upstream.conf;
    keepalive 32;
}

# Optional: Cloudflare Real IP Restoration (Uncomment if using Cloudflare Proxy)
# real_ip_header CF-Connecting-IP;
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;

# -----------------------------------------------------------------------------
# 1. CLIENT FRONTEND (Student Web Portal & Landing Page)
# Points to atomic symlink: /var/www/mmust-dcbt/current/client/dist
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/mmust-dcbt/current/client/dist;
    index index.html;

    # Security Headers (NOTE: Replace 'yourdomain.com' with your registered production domain)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.yourdomain.com wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Static Assets with 1-Year Cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # APK & Public Static Downloads
    location ~* \.(apk|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# -----------------------------------------------------------------------------
# 2. ADMIN DASHBOARD
# Points to atomic symlink: /var/www/mmust-dcbt/current/admin/dist
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com;

    root /var/www/mmust-dcbt/current/admin/dist;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.yourdomain.com wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Static Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# -----------------------------------------------------------------------------
# 3. BACKEND API (Express Reverse Proxy with Zero-Downtime Upstream)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://backend_api;
        
        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for Long-Polling / AI Streams
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
