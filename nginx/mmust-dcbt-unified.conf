# =============================================================================
# MMUST DCBT - Nginx Virtual Host Configuration (Unified Single Domain / IP)
# Zero-Downtime Edition (Blue-Green Upstream + Atomic Symlinks)
#
# Use this if you want everything on one domain or direct VPS IP:
#   - Student Portal:  http://YOUR_DOMAIN_OR_IP/
#   - Admin Dashboard: http://YOUR_DOMAIN_OR_IP/admin
#   - Backend API:     http://YOUR_DOMAIN_OR_IP/api/v1
#
# Copy to: /etc/nginx/sites-available/mmust-dcbt.conf
# Enable:  ln -sf /etc/nginx/sites-available/mmust-dcbt.conf /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx
# SSL:     certbot --nginx -d yourdomain.com
# =============================================================================

# Dynamic Upstream for Zero-Downtime Backend Swaps
upstream backend_api {
    include /var/www/mmust-dcbt/upstream.conf;
    keepalive 32;
}

# Optional: Cloudflare Real IP Restoration (Uncomment if using Cloudflare Proxy)
# real_ip_header CF-Connecting-IP;
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yourdomain.com www.yourdomain.com _;

    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # -------------------------------------------------------------------------
    # 1. BACKEND API REVERSE PROXY (/api/)
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # -------------------------------------------------------------------------
    # 2. ADMIN DASHBOARD (/admin)
    # Points to atomic symlink: /var/www/mmust-dcbt/current/admin/dist
    # -------------------------------------------------------------------------
    location ^~ /admin {
        alias /var/www/mmust-dcbt/current/admin/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }

    # -------------------------------------------------------------------------
    # 3. CLIENT PORTAL & LANDING (Root /)
    # Points to atomic symlink: /var/www/mmust-dcbt/current/client/dist
    # -------------------------------------------------------------------------
    location / {
        root /var/www/mmust-dcbt/current/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }
}
